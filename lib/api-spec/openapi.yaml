openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hamper Hub catalog, personalized gift orders, and secure photo uploads.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Curated hamper items.
  - name: orders
    description: Customer hamper orders.
  - name: storage
    description: Secure personalization photo uploads.
  - name: admin
    description: Studio-only order operations.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products available for custom hampers
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the signed-in customer's hamper orders
      responses:
        "200":
          description: Orders belonging to the current customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HamperOrder"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a custom hamper order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HamperOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamperOrder"
        "400":
          description: Invalid order or budget exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get one of the signed-in customer's orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamperOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all hamper orders for the studio
      responses:
        "200":
          description: All hamper orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HamperOrder"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Studio admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check whether the signed-in user can open the studio panel
      responses:
        "200":
          description: Studio access decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/orders/{id}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags: [admin]
      summary: Update a hamper order's fulfillment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HamperOrder"
        "400":
          description: Invalid status or order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Studio admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a secure photo upload URL
      description: Returns a short-lived URL for a direct private image upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Read a private uploaded photo
      description: Requires sign-in and verifies that the customer owns the photo or the account is the studio admin.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private image data
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The current customer does not own this photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, description, category, price, imageUrl, imageAlt, featured]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [sweet, savoury, self-care, home, keepsake]
        price:
          type: integer
          minimum: 1
        imageUrl:
          type: string
        imageAlt:
          type: string
        featured:
          type: boolean
    PackagingOption:
      type: string
      enum: [none, signature, celebration]
    OrderStatus:
      type: string
      enum: [placed, preparing, delivered]
    AdminOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
    AdminAccess:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 12
    OrderItem:
      type: object
      required: [productId, name, category, quantity, unitPrice, imageUrl, imageAlt]
      properties:
        productId:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [sweet, savoury, self-care, home, keepsake]
        quantity:
          type: integer
        unitPrice:
          type: integer
        imageUrl:
          type: string
        imageAlt:
          type: string
    DeliveryAddress:
      type: object
      required:
        [recipientName, recipientPhone, addressLine1, city, region, postalCode, country]
      properties:
        recipientName:
          type: string
          minLength: 2
          maxLength: 100
        recipientPhone:
          type: string
          minLength: 7
          maxLength: 24
        addressLine1:
          type: string
          minLength: 5
          maxLength: 200
        addressLine2:
          type: ["string", "null"]
          maxLength: 200
        city:
          type: string
          minLength: 2
          maxLength: 100
        region:
          type: string
          minLength: 2
          maxLength: 100
        postalCode:
          type: string
          minLength: 4
          maxLength: 12
        country:
          type: string
          minLength: 2
          maxLength: 80
    HamperOrderInput:
      type: object
      required: [items, budget, packagingOption, deliveryDate, deliveryAddress]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OrderItemInput"
        budget:
          type: integer
          minimum: 300
          maximum: 100000
        packagingOption:
          $ref: "#/components/schemas/PackagingOption"
        personalizationName:
          type: string
          maxLength: 50
        giftMessage:
          type: string
          maxLength: 300
        photoObjectPath:
          type: string
          maxLength: 512
        deliveryDate:
          type: string
          format: date
        deliveryAddress:
          $ref: "#/components/schemas/DeliveryAddress"
    HamperOrder:
      type: object
      required:
        - id
        - status
        - items
        - budget
        - itemsSubtotal
        - packagingFee
        - deliveryFee
        - total
        - packagingOption
        - personalizationName
        - giftMessage
        - photoObjectPath
        - deliveryDate
        - deliveryAddress
        - createdAt
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        budget:
          type: integer
        itemsSubtotal:
          type: integer
        packagingFee:
          type: integer
        deliveryFee:
          type: integer
        total:
          type: integer
        packagingOption:
          $ref: "#/components/schemas/PackagingOption"
        personalizationName:
          type: ["string", "null"]
        giftMessage:
          type: ["string", "null"]
        photoObjectPath:
          type: ["string", "null"]
        deliveryDate:
          type: string
          format: date
        deliveryAddress:
          $ref: "#/components/schemas/DeliveryAddress"
        createdAt:
          type: string
          format: date-time
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

